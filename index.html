<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101315"><link rel="manifest" href="manifest.webmanifest"><title>Stretch Studio</title><style>:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#101315;color:#f2f4f2}*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}main{max-width:650px;margin:auto;padding:22px 18px 100px}h1{font-size:28px;letter-spacing:-1px;margin:0}h2{font-size:20px;margin:18px 0}p,small{color:#aab4b0}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.accent{color:#b5d1bc}.panel,.item{background:#1c2224;border:1px solid #30393b;border-radius:18px;padding:16px;margin:12px 0}.item{display:flex;align-items:center;gap:14px}.item img{width:72px;height:72px;object-fit:cover;border-radius:12px;background:#303739}.grow{flex:1;min-width:0}button,input,select,textarea{font:inherit}button{background:#b5d1bc;color:#101715;border:0;border-radius:12px;padding:12px 16px;font-weight:650;cursor:pointer}button.secondary{background:#30393b;color:#f1f4f1}button.ghost{background:transparent;color:#b5d1bc;padding:8px}button:disabled{opacity:.4}input,select,textarea{width:100%;background:#111719;border:1px solid #45504d;color:white;border-radius:12px;padding:12px;margin:6px 0 13px}label{font-size:13px;color:#bac5c0}nav{position:fixed;bottom:0;left:0;right:0;background:#171c1ef5;border-top:1px solid #333b3d;display:flex;justify-content:center;padding:10px 5px calc(10px + env(safe-area-inset-bottom));gap:5px}nav button{flex:1;max-width:140px;background:transparent;color:#9faeaa;padding:9px 3px;font-size:12px}nav button.active{background:#303b38;color:#c5e4cd}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.row>*{flex-shrink:0}.wide{width:100%}.muted{color:#9eaaa5}.tag{display:inline-block;background:#303e38;color:#c7dfcc;border-radius:20px;padding:5px 9px;font-size:12px}.hero{width:100%;height:min(47vh,360px);object-fit:contain;background:#20292a;border-radius:20px;margin:12px 0}.timer{text-align:center;font-size:68px;letter-spacing:-3px;font-variant-numeric:tabular-nums;margin:10px 0}.progress{height:7px;background:#394341;border-radius:10px;overflow:hidden}.progress div{height:100%;background:#b5d1bc}.empty{text-align:center;padding:34px 12px;color:#9eaaa5}.hidden{display:none}#toast{position:fixed;top:20px;left:10%;right:10%;background:#c3e0ca;color:#152019;padding:13px;border-radius:12px;text-align:center;display:none;z-index:9}input[type=checkbox]{width:auto;margin:0;accent-color:#b5d1bc}input[type=file]{padding:8px} .stack{display:grid;gap:8px} .stack button{text-align:left} .danger{color:#ffb6ae!important}
/* Version 1.2: kompakter Trainingsbildschirm, Bedienelemente immer erreichbar */

</style></head><body><div id="toast"></div><main id="app"></main><nav id="nav"></nav><script>
const DB='stretch-studio-v1';let db,view='home',editId=null,editingRoutine=null,session=null,interval=null,wake=null;const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>crypto.randomUUID();function notify(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2600)}function openDB(){return new Promise((resolve,reject)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{r.result.createObjectStore('exercises',{keyPath:'id'});r.result.createObjectStore('routines',{keyPath:'id'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}function all(store){return new Promise((resolve,reject)=>{let r=db.transaction(store).objectStore(store).getAll();r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}function put(store,obj){return new Promise((resolve,reject)=>{let r=db.transaction(store,'readwrite').objectStore(store).put(obj);r.onsuccess=resolve;r.onerror=()=>reject(r.error)})}function del(store,id){return new Promise((resolve,reject)=>{let r=db.transaction(store,'readwrite').objectStore(store).delete(id);r.onsuccess=resolve;r.onerror=()=>reject(r.error)})}function navTo(v){stopTimer();view=v;render()}function navHTML(){return [['home','Start','⌂'],['library','Übungen','◈'],['routines','Routinen','▤'],['settings','Mehr','⚙']].map(([id,t,i])=>`<button class="${view===id?'active':''}" onclick="navTo('${id}')">${i}<br>${t}</button>`).join('')}function header(t,sub=''){return `<header><div><h1>${t}</h1><small>${sub}</small></div><span class="accent" style="font-size:27px">✳</span></header>`}function btn(t,fn,cls=''){return `<button class="${cls}" onclick="${fn}">${t}</button>`}function exerciseCard(e){return `<div class="item">${e.image?`<img src="${e.image}">`:`<div style="width:72px;height:72px;background:#303a3b;border-radius:12px;display:grid;place-items:center;font-size:26px">✳</div>`}<div class="grow"><b>${esc(e.name)}</b><br><small>${esc(e.areas.join(' · '))} · ${e.duration}s${e.sides?' je Seite':''}</small></div>${btn('Öffnen',`openExercise('${e.id}')`,'secondary')}</div>`}let exercises=[],routines=[];async function refresh(){exercises=await all('exercises');routines=await all('routines')}async function render(){await refresh();document.body.classList.toggle('training-active',view==='player');$('nav').innerHTML=navHTML();let h='';if(view==='home'){h=header('Stretch Studio','Dein Raum für Bewegung')+`<div class="panel"><span class="tag">DEINE ROUTINEN</span><h2>Bereit für eine Pause?</h2><p>Wähle ein Programm und starte deine Dehnzeit – ohne Video und ohne Ablenkung.</p>${routines.length? routines.map(r=>`<div class="item"><div class="grow"><b>${esc(r.name)}</b><br><small>${r.items.length} Übungen</small></div>${btn('Starten',`startRoutine('${r.id}')`)}</div>`).join(''):`${btn('Erste Routine erstellen',"navTo('routines')")}`}</div><div class="panel"><b>Deine Bibliothek</b><p>${exercises.length} Übungen · ${routines.length} Routinen</p>${btn('Übungen ansehen',"navTo('library')",'secondary')}</div>`}if(view==='library'){h=header('Übungen','Deine persönliche Bibliothek')+`<input id="search" placeholder="Übung suchen …" oninput="filterExercises()"><select id="areaFilter" onchange="filterExercises()"><option value="">Alle Körperbereiche</option>${[...new Set(exercises.flatMap(e=>e.areas))].sort().map(a=>`<option>${esc(a)}</option>`).join('')}</select>${btn('+ Übung hinzufügen','newExercise()','wide')}<div id="exerciseList"></div>`}if(view==='exercise'){let e=exercises.find(x=>x.id===editId);h=header(e?'Übung bearbeiten':'Neue Übung','Name, Körperbereich und Bild')+`<form id="exerciseForm" onsubmit="saveExercise(event)"><label>Name<input name="name" required value="${esc(e?.name||'')}"></label><label>Körperbereiche (mit Komma trennen)<input name="areas" required placeholder="z. B. Hüfte, Beine" value="${esc(e?.areas.join(', ')||'')}"></label><label>Dauer in Sekunden<input type="number" min="5" max="3600" name="duration" value="${e?.duration||45}" required></label><label><input type="checkbox" name="sides" ${e?.sides?'checked':''}> Links und rechts getrennt ausführen</label><p><label>Bild vom iPhone (optional)<input type="file" accept="image/*" id="photo"></label></p>${e?.image?`<img class="hero" src="${e.image}">`:''}<label>Kurze Anleitung<textarea name="notes" rows="3">${esc(e?.notes||'')}</textarea></label><div class="row">${btn('Speichern','', 'wide')}</div></form>${e?btn('Übung löschen','deleteExercise()','ghost danger'):''}`;h=h.replace('<button class="wide" onclick="">Speichern</button>','<button class="wide" type="submit">Speichern</button>')}if(view==='routines'){h=header('Routinen','Deine gespeicherten Programme')+btn('+ Neue Routine','newRoutine()','wide')+(routines.length?routines.map(r=>`<div class="item"><div class="grow"><b>${esc(r.name)}</b><br><small>${r.items.length} Übungen</small></div>${btn('Start',`startRoutine('${r.id}')`)}${btn('Edit',`openRoutine('${r.id}')`,'secondary')}</div>`).join(''):'<div class="empty">Noch keine Routinen vorhanden.</div>')}if(view==='routine'){let r=routines.find(x=>x.id===editingRoutine);h=header(r?'Routine bearbeiten':'Neue Routine','Reihenfolge festlegen · Zeiten aus der Übungsbibliothek')+`<label>Name<input id="routineName" value="${esc(r?.name||'')}" placeholder="z. B. Dehnen nach dem Laufband"></label><label>Wechselpause (Sekunden)<input type="number" id="pause" min="0" max="120" value="${r?.pause??10}"></label><div id="routineItems"></div><h2>Übung hinzufügen</h2><select id="addEx"><option value="">Übung wählen …</option>${exercises.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('')}</select>${btn('+ Hinzufügen','addRoutineItem()','secondary')}<div style="height:20px"></div>${btn('Routine speichern','saveRoutine()','wide')}${r?btn('Routine löschen','deleteRoutine()','ghost danger'):''}`;window.draftItems=structuredClone(r?.items||[])}if(view==='settings'){h=header('Einstellungen','Daten und Training')+`<div class="panel"><h2>Datensicherung</h2><p>Speichert alle Übungen, Bilder und Routinen in einer JSON-Datei. Bewahre sie sicher in der Dateien-App auf.</p>${btn('Backup exportieren','backup()','wide')}<label>Backup wiederherstellen<input type="file" accept="application/json,.json" onchange="restore(event)"></label><small>Beim Import werden gleichnamige IDs überschrieben; andere Einträge bleiben erhalten.</small></div><div class="panel"><h2>Hinweise</h2><p>Offline nach der Installation. Während des Trainings sollte das iPhone entsperrt bleiben. Der Signalton kann Musik unterbrechen; Vibration ist auf iOS-Webseiten nicht zuverlässig verfügbar.</p></div>`}if(view==='player'){h=playerHTML()}$('app').innerHTML=h;if(view==='library')filterExercises();if(view==='routine')renderDraft();if(view==='player')updatePlayer()}
function filterExercises(){let q=($('search')?.value||'').toLowerCase(),a=$('areaFilter')?.value||'';let list=exercises.filter(e=>(e.name+' '+e.areas.join(' ')).toLowerCase().includes(q)&&(!a||e.areas.includes(a)));$('exerciseList').innerHTML=list.map(exerciseCard).join('')||'<div class="empty">Keine passenden Übungen</div>'}function newExercise(){editId=null;view='exercise';render()}function openExercise(id){editId=id;view='exercise';render()}async function fileData(file){if(!file)return null;return new Promise((resolve,reject)=>{let img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{let c=document.createElement('canvas'),scale=Math.min(1,900/img.width,900/img.height);c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);resolve(c.toDataURL('image/jpeg',.78))};img.onerror=reject;img.src=url})}async function saveExercise(ev){ev.preventDefault();let f=ev.target,e=exercises.find(x=>x.id===editId);let image=await fileData($('photo').files[0])||e?.image||null;await put('exercises',{id:editId||uid(),name:f.elements.name.value.trim(),areas:f.elements.areas.value.split(',').map(x=>x.trim()).filter(Boolean),duration:+f.elements.duration.value,sides:f.elements.sides.checked,notes:f.elements.notes.value,image});notify('Übung gespeichert');navTo('library')}async function deleteExercise(){if(!confirm('Übung wirklich löschen?'))return;await del('exercises',editId);for(let r of routines){r.items=r.items.filter(i=>i.id!==editId);await put('routines',r)}navTo('library')}
function newRoutine(){editingRoutine=null;view='routine';render()}function openRoutine(id){editingRoutine=id;view='routine';render()}function addRoutineItem(){let id=$('addEx').value;if(!id)return;let e=exercises.find(e=>e.id===id);draftItems.push({id});renderDraft()}function moveItem(i,d){let j=i+d;if(j<0||j>=draftItems.length)return;[draftItems[i],draftItems[j]]=[draftItems[j],draftItems[i]];renderDraft()}function removeItem(i){draftItems.splice(i,1);renderDraft()}function renderDraft(){$('routineItems').innerHTML=draftItems.map((it,i)=>{let e=exercises.find(x=>x.id===it.id);return `<div class="panel"><div class="row"><b class="grow">${i+1}. ${esc(e?.name||'Gelöschte Übung')}</b>${btn('↑',`moveItem(${i},-1)`,'secondary')}${btn('↓',`moveItem(${i},1)`,'secondary')}${btn('×',`removeItem(${i})`,'secondary')}</div><small>Dauer: ${e?.duration??'–'} s${e?.sides?' je Seite':''} · wird aus der Übungsbibliothek übernommen</small></div>`}).join('')||'<p>Noch keine Übungen ausgewählt.</p>'}async function saveRoutine(){let name=$('routineName').value.trim();if(!name||!draftItems.length){notify('Name und mindestens eine Übung fehlen');return}await put('routines',{id:editingRoutine||uid(),name,pause:Math.max(0,+$('pause').value||0),items:draftItems.map(it=>({id:it.id}))});notify('Routine gespeichert');navTo('routines')}async function deleteRoutine(){if(!confirm('Routine löschen?'))return;await del('routines',editingRoutine);navTo('routines')}
function buildSteps(r){let s=[];r.items.forEach(it=>{let e=exercises.find(x=>x.id===it.id);if(!e)return;for(let side of(e.sides?['Links','Rechts']:[''])){if(s.length&&r.pause)s.push({pause:true,name:'Wechselpause',duration:r.pause});s.push({name:e.name,area:e.areas.join(' · '),image:e.image,notes:e.notes,side,duration:e.duration})}});return s}function startRoutine(id){let r=routines.find(x=>x.id===id);let steps=buildSteps(r);if(!steps.length){notify('Keine gültigen Übungen');return}session={steps,index:0,remaining:steps[0].duration,running:false,endsAt:0,routine:r.name};view='player';render()}function playerHTML(){let s=session.steps[session.index];return header('Training',esc(session.routine))+`<div style="text-align:center"><span class="tag" id="stepCount"></span><h2 id="poseName"></h2><p id="poseArea"></p><img id="poseImage" class="hero hidden"><div id="posePlaceholder" class="hero" style="display:grid;place-items:center;font-size:60px">✳</div><div class="progress"><div id="bar"></div></div><div class="timer" id="countdown"></div><p id="notes"></p><div class="player-actions">${btn('← Zurück','previousStep()','secondary')}${btn('Start','toggleTimer()')}${btn('Weiter →','nextStep()','secondary')}</div><p class="player-exit">${btn('Training beenden',"navTo('home')",'ghost')}</p></div>`}function formatTime(n){return `${Math.floor(n/60).toString().padStart(2,'0')}:${(n%60).toString().padStart(2,'0')}`}function updatePlayer(){if(view!=='player'||!session)return;let s=session.steps[session.index];$('stepCount').textContent=`Schritt ${session.index+1} von ${session.steps.length}`;let upcoming=s.pause?session.steps.slice(session.index+1).find(step=>!step.pause):null;let shown=upcoming||s;document.body.classList.toggle('pause-preview',!!upcoming);$('poseName').textContent=upcoming?'Als Nächstes: '+shown.name+(shown.side?' · '+shown.side:''):shown.name+(shown.side?' · '+shown.side:'');$('poseArea').textContent=shown.area||(s.pause?'Bereite dich auf die nächste Pose vor':'');$('notes').textContent=shown.notes||'';$('countdown').textContent=formatTime(Math.ceil(session.remaining));$('bar').style.width=(100*(1-session.remaining/s.duration))+'%';$('poseImage').classList.toggle('hidden',!shown.image);$('posePlaceholder').style.display=shown.image?'none':'grid';if(shown.image&&$('poseImage').getAttribute('src')!==shown.image)$('poseImage').src=shown.image;document.querySelector('[onclick="toggleTimer()"]')?.replaceChildren(document.createTextNode(session.running?'Pause':'Start'))}let audio;let soundReady=false;
async function prepareAudio(){
  try{
    audio??=new(window.AudioContext||window.webkitAudioContext)();
    if(audio.state!=='running')await audio.resume();
    soundReady=audio.state==='running';
    return soundReady;
  }catch(e){return false}
}
function playTone(frequency=740,duration=.22){
  if(!audio||audio.state!=='running')return false;
  try{
    const oscillator=audio.createOscillator(),gain=audio.createGain(),start=audio.currentTime+.015;
    oscillator.type='sine';oscillator.frequency.setValueAtTime(frequency,start);
    gain.gain.setValueAtTime(.0001,start);
    gain.gain.exponentialRampToValueAtTime(.36,start+.018);
    gain.gain.exponentialRampToValueAtTime(.0001,start+duration);
    oscillator.connect(gain);gain.connect(audio.destination);
    oscillator.start(start);oscillator.stop(start+duration+.025);
    oscillator.onended=()=>{oscillator.disconnect();gain.disconnect()};
    return true;
  }catch(e){return false}
}
async function beep(frequency=740){
  if(await prepareAudio())playTone(frequency);
}
async function acquireWake(){try{wake=await navigator.wakeLock?.request('screen')}catch(e){}}function stopTimer(){clearInterval(interval);interval=null;if(wake){wake.release().catch(()=>{});wake=null}if(session)session.running=false}function toggleTimer(){if(!session)return;if(session.running){session.remaining=Math.max(0,(session.endsAt-Date.now())/1000);stopTimer();updatePlayer();return}beep();session.running=true;session.endsAt=Date.now()+session.remaining*1000;acquireWake();interval=setInterval(tick,150);updatePlayer()}function tick(){if(!session?.running)return;session.remaining=Math.max(0,(session.endsAt-Date.now())/1000);if(session.remaining<=0){beep(880);advance(1,true)}else updatePlayer()}function advance(dir,keepRunning=false){let running=keepRunning&&session.running;stopTimer();let n=session.index+dir;if(n>=session.steps.length){notify('Training abgeschlossen ✨');navTo('home');return}session.index=Math.max(0,n);session.remaining=session.steps[session.index].duration;if(running){session.running=true;session.endsAt=Date.now()+session.remaining*1000;acquireWake();interval=setInterval(tick,150)}updatePlayer()}function nextStep(){advance(1,session.running)}function previousStep(){advance(-1,session.running)}async function backup(){let data={format:'stretch-studio-backup',version:1,date:new Date().toISOString(),exercises:await all('exercises'),routines:await all('routines')};let blob=new Blob([JSON.stringify(data)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='stretch-studio-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}async function restore(ev){try{let d=JSON.parse(await ev.target.files[0].text());if(d.format!=='stretch-studio-backup'||!Array.isArray(d.exercises)||!Array.isArray(d.routines))throw Error('Ungültige Backup-Datei');if(!confirm(`${d.exercises.length} Übungen und ${d.routines.length} Routinen importieren? Vorhandene Einträge mit gleicher ID werden ersetzt.`))return;for(let e of d.exercises)await put('exercises',e);for(let r of d.routines)await put('routines',r);notify('Backup importiert');render()}catch(e){notify('Import fehlgeschlagen: '+e.message)}}document.addEventListener('visibilitychange',()=>{if(!document.hidden&&session?.running)tick()});(async()=>{try{db=await openDB();render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{})}catch(e){$('app').innerHTML='<h2>Speicher nicht verfügbar</h2><p>Bitte die App in Safari öffnen.</p>'}})();
</script></body></html>
